name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subweb_ci
          POSTGRES_PASSWORD: subweb_ci
          POSTGRES_DB: subweb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U subweb_ci -d subweb_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://subweb_ci:subweb_ci@127.0.0.1:5432/subweb_test
      - run: npm run build

  images:
    name: Build das imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, controller, edge, worker]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/Dockerfile.${{ matrix.service }} -t subweb-${{ matrix.service }}:ci .
